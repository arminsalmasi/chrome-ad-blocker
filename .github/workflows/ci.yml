name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: make test
      - name: Syntax & JSON checks
        run: make check
      - name: Shipped rulesets and site cosmetics match snapshots
        run: |
          make rules
          git diff --exit-code rules/ content/cosmetic_sites/
