name: Update blocklists

# Monthly: refresh upstream list snapshots, rebuild rules and site cosmetics,
# and open a pull request. main is protected, so the PR goes through the
# required CI check before it can be merged.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh snapshots and rebuild
        run: make update-lists
      - name: Verify
        run: make test check
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Lists unchanged; nothing to do."
            exit 0
          fi
          branch="chore/update-lists-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Update blocklist snapshots ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update blocklist snapshots ($(date -u +%Y-%m-%d))" \
            --body "Automated monthly refresh of upstream lists (StevenBlack, AdGuard CNAME, EasyList, EasyPrivacy) via \`make update-lists\`. Run \`make site-test\` locally before merging."
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
          # dispatch CI explicitly to produce the required "check" status.
          gh workflow run ci.yml --ref "$branch"
